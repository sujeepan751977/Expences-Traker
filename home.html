<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Expense Tracker</h1>
        <div class="subtitle">
            <p>Track your expenses and manage your budget effectively.</p>
        </div>       
    </div>

    <!-- Overview of Balance, Income and Expense -->

    <div class="over-view-box">
        <div>
            <h2>Balance</h2>
            <p id="Balance">LKR 0.00</p>
        </div>
        <div >
            <h2>Income</h2>
            <p id="Income">LKR 0.00</p>
        </div>
        <div>
            <h2>Expense</h2>
            <p id="Expense">LKR 0.00</p>
        </div>

        <div class="history">
            <a href="history.html">View History</a>
        </div>

        <div class="add-transaction-buttons">
            <button class="income-button" ><a class="btn-link" href="transaction.html">Add Income</a></button>
            <button class="expense-button" ><a class="btn-link" href="transaction.html">Add Expense</a></button>
        </div>
    </div>

    

    
    
</body>
</html>
