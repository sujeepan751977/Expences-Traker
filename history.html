<!DOCTYPE html>
<html lang="en">
<head>
    <title>History</title>
    <link rel="stylesheet" href="css\style.css">
    
</head>
<body>
    <div class="container">
        <h1>Your Transaction History</h1>
        <p>Review your past transactions and manage your finances effectively.</p>
        <div class="back-button-wrap">
            <a class="back-button" href="home.html">Back</a>
        </div>
    </div>

    <div class="over-view-box">
        <div>
            <h2>Balance</h2>
            <p id="Balance">LKR 0.00</p>
        </div>
        <div >
            <h2>Income</h2>
            <p id="Income">LKR 0.00</p>
        </div>
        <div>
            <h2>Expense</h2>
            <p id="Expense">LKR 0.00</p>
        </div>
    </div>

    <!-- Transaction History -->

    <div class="filter-box">
        <h2>Filter Transactions</h2>
        <div class="filter-row">
            <div class="filter-item">
                <label for="filter-date">Filter by Date</label>
                <input type="date" id="filter-date">
            </div>
            <div class="filter-item">
                <label for="filter-month">Filter by Month</label>
                <input type="month" id="filter-month">
            </div>
        </div>
        <div class="filter-buttons">
            <button type="button" id="apply-filter-button" class="btn">Apply Filter</button>
            <button type="button" id="clear-filter-button" class="btn clear-btn">Show All</button>
        </div>
    </div>

    <div class="transaction-history">
        <h2>Transaction History</h2>
        <ul id="transaction-list">
            <!-- Transactions will be dynamically added here -->
        </ul>
    </div>

    <script src="js/storage.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
    
</body>
</html>
