<!DOCTYPE html>
<html lang="en">
<head>
    <title>History</title>
    <link rel="stylesheet" href="css\style.css">
</head>
<body>
    <div class="container">
        <h1>Your Transaction History</h1>
        <p>Review your past transactions and manage your finances effectively.</p>
    </div>

    <div class="over-view-box">
        <div>
            <h2>Balance</h2>
            <p id="Balance">LKR 0.00</p>
        </div>
        <div >
            <h2>Income</h2>
            <p id="Income">LKR 0.00</p>
        </div>
        <div>
            <h2>Expense</h2>
            <p id="Expense">LKR 0.00</p>
        </div>
    </div>

    <!-- Transaction History -->

    <div class="transaction-history">
        <h2>Transaction History</h2>
        <ul id="transaction-list">
            <!-- Transactions will be dynamically added here -->
        </ul>
    </div>

    
    
</body>
</html>
